[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "school-declaration-plugin"
version = "1.0.0"
description = "An external AI declaration analyzer for school-lab"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["school-lab>=0.5.0,<2.0.0"]

[project.entry-points."school_lab.analyzers"]
external-declaration = "declaration_plugin:ExternalDeclarationAnalyzer"

[tool.setuptools.packages.find]
where = ["src"]
